name: reply-mcfly

x-app: &app
  image: reply-mcfly:local
  environment:
    MCFLY_DATABASE_URL: postgresql+psycopg://mcfly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/mcfly
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:-reply-mcfly-poc}
    GCP_REGION: ${GCP_REGION:-europe-west1}
    VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-eu}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    MCFLY_MAILBOX_ID: ${MCFLY_MAILBOX_ID:-}
    MCFLY_ENABLE_THREAD_HISTORY: ${MCFLY_ENABLE_THREAD_HISTORY:-false}
    MCFLY_ENABLE_RAG: ${MCFLY_ENABLE_RAG:-false}
    MCFLY_RAG_BACKEND: ${MCFLY_RAG_BACKEND:-markdown}
    MCFLY_RAG_EMBEDDING_MODEL: ${MCFLY_RAG_EMBEDDING_MODEL:-gemini-embedding-001}
    MCFLY_RAG_EMBEDDING_DIMS: ${MCFLY_RAG_EMBEDDING_DIMS:-768}
    MCFLY_RAG_EMBEDDING_LOCATION: ${MCFLY_RAG_EMBEDDING_LOCATION:-}
    MCFLY_RAG_TOP_K: ${MCFLY_RAG_TOP_K:-3}
    MCFLY_RAG_TIMEOUT_SECONDS: ${MCFLY_RAG_TIMEOUT_SECONDS:-10}
    MCFLY_ALLOWED_SENDERS: ${MCFLY_ALLOWED_SENDERS:-[]}
    MCFLY_GMAIL_OAUTH_SECRET_VERSION: ${MCFLY_GMAIL_OAUTH_SECRET_VERSION:-}
    MCFLY_SYNC_QUEUE: ${MCFLY_SYNC_QUEUE:-}
    MCFLY_PROCESS_QUEUE: ${MCFLY_PROCESS_QUEUE:-}
    MCFLY_WORKER_URL: ${MCFLY_WORKER_URL:-}
    MCFLY_INGRESS_AUDIENCE: ${MCFLY_INGRESS_AUDIENCE:-}
    MCFLY_PUBSUB_SERVICE_ACCOUNT: ${MCFLY_PUBSUB_SERVICE_ACCOUNT:-}
    MCFLY_TASKS_SERVICE_ACCOUNT: ${MCFLY_TASKS_SERVICE_ACCOUNT:-}
  depends_on:
    postgres:
      condition: service_healthy
  init: true
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
    interval: 5s
    timeout: 6s
    retries: 12
    start_period: 10s

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: mcfly
      POSTGRES_USER: mcfly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcfly -d mcfly"]
      interval: 2s
      timeout: 3s
      retries: 20

  ingress:
    <<: *app
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${INGRESS_PORT:-8080}:8080"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn reply_mcfly.api.ingress:create_ingress --factory --host 0.0.0.0 --port 8080"]

  worker:
    <<: *app
    depends_on:
      ingress:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORKER_PORT:-8081}:8080"
    command: ["uvicorn", "reply_mcfly.api.worker:create_worker", "--factory", "--host", "0.0.0.0", "--port", "8080"]

  tests:
    <<: *app
    image: reply-mcfly:test
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      MCFLY_DATABASE_URL: postgresql+psycopg://mcfly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/mcfly
      TEST_DATABASE_URL: postgresql+psycopg://mcfly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/mcfly
    depends_on:
      ingress:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres_data:
